name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentquake
          POSTGRES_PASSWORD: agentquake
          POSTGRES_DB: agentquake
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agentquake -d agentquake"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://agentquake:agentquake@127.0.0.1:5433/agentquake

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Use npm 12
        run: npm install -g npm@12.2.1

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migrate database
        run: npm run db:deploy

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
