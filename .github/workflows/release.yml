name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 12
        run: npm install -g npm@12.2.1

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./packages/agentquake/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match agentquake $version. Tag it v$version."
            exit 1
          fi

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck -w agentquake

      - name: Unit tests
        run: npm test -w agentquake

      - name: Build
        run: npm run build -w agentquake

      - name: Publish
        working-directory: packages/agentquake
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
